name: CI - Testing & Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.10'

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ./reconcile-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov coverage[toml] ruff black isort
      
      - name: Create .env file for testing
        working-directory: ./reconcile-agent
        run: |
          cat > .env << EOF
          # Test Environment Configuration
          DATABASE_URL=sqlite+aiosqlite:///./test_reconcile.db
          
          # Mock API Keys (for testing)
          RAZORPAY_KEY_ID=rzp_test_mock_key
          RAZORPAY_KEY_SECRET=mock_secret
          RAZORPAY_WEBHOOK_SECRET=whsec_mock_webhook_secret
          
          # LLM Configuration (Mock for testing)
          OPENROUTER_API_KEY=sk-or-mock-key
          OPENROUTER_MODEL=openai/gpt-4o-mini
          OPENROUTER_BASE_URL=https://openrouter.ai/api/v1
          
          GEMINI_API_KEY=mock_gemini_key
          GEMINI_MODEL=gemini-2.0-flash
          
          # Security & Rate Limiting
          API_KEY=test_api_key_for_ci
          API_KEY_ENABLED=false
          RATE_LIMIT_CAPACITY=60
          RATE_LIMIT_REFILL_RATE=1.0
          MAX_UPLOAD_SIZE_BYTES=104857600
          QA_MAX_QUESTION_LENGTH=4000
          CORS_ALLOWED_ORIGINS=*
          
          # Testing
          USE_FIXTURES=1
          EOF
      
      - name: Run database migrations
        working-directory: ./reconcile-agent
        run: |
          alembic upgrade head
      
      - name: Run tests with coverage
        working-directory: ./reconcile-agent
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term --cov-report=html
      
      - name: Upload coverage reports to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./reconcile-agent/coverage.xml
          flags: unittests
          name: codecov-reconcile-agent
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./reconcile-agent/htmlcov/
          retention-days: 7

  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort mypy bandit safety
      
      - name: Run Ruff (Fast Python linter)
        working-directory: ./reconcile-agent
        run: |
          ruff check app/ tests/ --output-format=github
        continue-on-error: true
      
      - name: Check code formatting with Black
        working-directory: ./reconcile-agent
        run: |
          black --check app/ tests/
        continue-on-error: true
      
      - name: Check import sorting with isort
        working-directory: ./reconcile-agent
        run: |
          isort --check-only app/ tests/
        continue-on-error: true
      
      - name: Type checking with mypy
        working-directory: ./reconcile-agent
        run: |
          pip install -r requirements.txt
          mypy app/ --ignore-missing-imports
        continue-on-error: true

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
      
      - name: Run Bandit security linter
        working-directory: ./reconcile-agent
        run: |
          bandit -r app/ -f json -o bandit-report.json
          bandit -r app/ -f screen
        continue-on-error: true
      
      - name: Check for known vulnerabilities in dependencies
        working-directory: ./reconcile-agent
        run: |
          safety check --json --file requirements.txt
        continue-on-error: true
      
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: ./reconcile-agent/bandit-report.json
          retention-days: 7

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ./reconcile-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create test environment
        working-directory: ./reconcile-agent
        run: |
          cat > .env << EOF
          DATABASE_URL=sqlite+aiosqlite:///./test_reconcile.db
          RAZORPAY_KEY_ID=rzp_test_mock_key
          RAZORPAY_KEY_SECRET=mock_secret
          RAZORPAY_WEBHOOK_SECRET=whsec_mock_webhook_secret
          OPENROUTER_API_KEY=sk-or-mock-key
          OPENROUTER_MODEL=openai/gpt-4o-mini
          GEMINI_API_KEY=mock_gemini_key
          GEMINI_MODEL=gemini-2.0-flash
          API_KEY_ENABLED=false
          USE_FIXTURES=1
          EOF
      
      - name: Run database migrations
        working-directory: ./reconcile-agent
        run: |
          alembic upgrade head
      
      - name: Run integration tests
        working-directory: ./reconcile-agent
        run: |
          pytest tests/test_batch_e2e.py tests/test_full_reconciliation.py -v --tb=short

  build-status:
    name: Build Status Summary
    runs-on: ubuntu-latest
    needs: [test, lint, security, integration-test]
    if: always()
    
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::Tests failed"
            exit 1
          fi
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "::warning::Linting checks failed"
          fi
          if [ "${{ needs.security.result }}" != "success" ]; then
            echo "::warning::Security checks failed"
          fi
          if [ "${{ needs.integration-test.result }}" != "success" ]; then
            echo "::error::Integration tests failed"
            exit 1
          fi
          echo "✅ All required checks passed!"

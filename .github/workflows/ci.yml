name: CI / Test & Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Test Suite & Coverage
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: reconcile-agent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: reconcile-agent/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run Database Migrations
        run: |
          alembic upgrade head

      - name: Run Pytest Test Suite (102 Tests)
        env:
          RAZORPAY_KEY_ID: "rzp_test_mock_ci_key"
          RAZORPAY_KEY_SECRET: "mock_ci_secret"
          RAZORPAY_WEBHOOK_SECRET: "mock_webhook_secret_ci"
          DATABASE_URL: "sqlite+aiosqlite:///./reconcile.db"
          API_KEY_ENABLED: "false"
          USE_FIXTURES: "0"
        run: |
          python -m pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: reconcile-agent/coverage.xml
          if-no-files-found: ignore

  docker:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./reconcile-agent
          file: ./reconcile-agent/Dockerfile
          push: false
          tags: reconcile-agent:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
